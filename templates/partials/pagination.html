{%- if paginator and paginator.number_pagers > 1 %}
<nav class="pagination" aria-label="Pagination">
  {%- if paginator.previous %}<a class="text-link" href="{{ paginator.previous }}">← Newer</a>{% else %}<span></span>{% endif %}
  {%- if paginator.next %}<a class="text-link" href="{{ paginator.next }}">Older →</a>{% endif %}
</nav>
{%- endif %}
