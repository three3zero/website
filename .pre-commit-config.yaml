repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/design/reference/
      - id: end-of-file-fixer
        exclude: ^docs/design/reference/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: zola-check
        name: zola check
        entry: zola check --skip-external-links
        language: system
        pass_filenames: false
        files: ^(config\.toml|content/|templates/|static/|highlight/)
